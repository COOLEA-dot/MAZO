{% extends 'base.html' %}

{% block title %}{{ _('Subir Video') }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">

<h1>Sube tu Video</h1>

<form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data" id="uploadForm">
    <!-- CSRF Token -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="title">{{ _('Título del Video:') }}</label>
    <input type="text" name="title" id="title" required>

    <label for="description">{{ _('Descripción:') }}</label>
    <textarea name="description" id="description" rows="3"></textarea>

    <label for="hashtags">{{ _('Hashtags (separados por comas):') }}</label>
    <input type="text" name="hashtags" id="hashtags" placeholder="#ejemplo, #video">

    <label for="video_file">{{ _('Selecciona un video:') }}</label>
    <input type="file" name="video_file" id="video_file" accept="video/*" required>

    <button type="submit">{{ _('Subir Video') }}</button>
</form>

<br>
<a href="{{ url_for('profile', username=g.user.username) }}">{{ _('Volver al perfil') }}</a>

<!-- Puedes mostrar el área de progreso desde el backend si lo necesitas -->
{% endblock %}

{% block scripts %}
<!-- No se necesita JS para el envío, se eliminaron scripts innecesarios -->
{% endblock %}
