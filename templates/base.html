<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Aplicación{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/logout_modal.css') }}">
    <script src="https://unpkg.com/cloudinary-video-player@1.9.13/dist/cld-video-player.min.js"></script>
    <link href="https://unpkg.com/cloudinary-video-player@1.9.13/dist/cld-video-player.min.css" rel="stylesheet">
</head>
<body>
    <!-- Barra de tareas -->
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="{{ url_for('home') }}">MAZO</a>
        </div>

        <ul class="navbar-links">
            <li>
                <a href="{{ url_for('home') }}">
                    <i class="fas fa-home"></i>
                    <span class="link-text">Inicio</span>
                </a>
            </li>
            {% if g.user %}
                <li>
                    <a href="{{ url_for('profile', username=g.user.username) }}">
                        <i class="fas fa-user"></i>
                        <span class="link-text">Perfil</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('chats') }}">
                        <i class="fas fa-comments"></i>
                        <span class="link-text">Chats</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('logout') }}" onclick="openLogoutModal(event)">
                        <i class="fas fa-sign-out-alt"></i>
                        <span class="link-text">Salir</span>
                    </a>
                </li>
            {% else %}
                <li>
                    <a href="{{ url_for('login') }}">
                        <i class="fas fa-sign-in-alt"></i>
                        <span class="link-text">Entrar</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('register') }}">
                        <i class="fas fa-user-plus"></i>
                        <span class="link-text">Registrarse</span>
                    </a>
                </li>
            {% endif %}
            <li class="mobile-only">
                <button class="mobile-search-icon" onclick="toggleMobileSearch()">
                    <i class="fas fa-search"></i>
                </button>
            </li>
        </ul>

        <!-- Buscador escritorio -->
        <div class="navbar-search desktop-only">
            <form method="GET" action="{{ url_for('search') }}">
                <input type="text" name="q" placeholder="Buscar...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
        </div>
    </nav>

    <!-- Buscador móvil desplegable -->
    <div class="mobile-search-form mobile-only" id="mobileSearchForm">
        <form method="GET" action="{{ url_for('search') }}">
            <input type="text" name="q" placeholder="Buscar...">
            <button type="submit"><i class="fas fa-search"></i></button>
        </form>
    </div>

    <!-- Contenido de la página -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Modal para cerrar sesión -->
    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <p>¿Estás seguro de que quieres cerrar sesión?</p>
            <div class="modal-buttons">
                <button onclick="confirmLogout()">Sí</button>
                <button onclick="closeLogoutModal()">No</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
    function toggleMobileSearch() {
        const form = document.getElementById('mobileSearchForm');
        if (form.style.display === 'flex') {
            form.style.display = 'none';
        } else {
            form.style.display = 'flex';
            form.querySelector('input').focus();  // Enfocar automáticamente
        }
    }

    // Cerrar si se hace clic fuera del buscador
    document.addEventListener('click', function(event) {
        const searchIcon = document.querySelector('.mobile-search-icon');
        const form = document.getElementById('mobileSearchForm');

        if (!form.contains(event.target) && !searchIcon.contains(event.target)) {
            form.style.display = 'none';
        }
    });
    </script>
</body>
</html>
