<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ _('Inicio de Sesión') }} - MAZO</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <h1>{{ _('Inicio de Sesión') }}</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <!-- CSRF Token -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Username -->
        <label for="username">{{ _('Usuario:') }}</label>
        <input type="text" id="username" name="username" required>

        <!-- Password -->
        <label for="password">{{ _('Contraseña:') }}</label>
        <input type="password" id="password" name="password" required>

        <!-- Submit Button -->
        <button type="submit">{{ _('Iniciar Sesión') }}</button>
    </form>

    <p>{{ _('¿No tienes cuenta?') }} <a href="/register">{{ _('Regístrate aquí') }}</a></p>
</body>
</html>
