{% extends 'base.html' %}

{% block title %}{{ _('Editar Perfil') }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profile.css') }}">

<div class="edit-profile-container">
  <h2>{{ _('Editar Perfil') }}</h2>

  <form action="{{ url_for('edit_profile') }}" method="POST" enctype="multipart/form-data" class="edit-profile-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="profile-picture-preview">
      <img id="profile-preview"
           src="{{ url_for('static', filename=user.profile_pic if user.profile_pic else 'profile_pics/default.jpg') }}"
           alt="Foto actual" class="current-profile-pic">
      <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
    </div>

    <div>
      <label for="name">{{ _('Nombre:') }}</label>
      <input type="text" id="name" name="name" value="{{ user.name | default('', true) }}" required>
    </div>

    <div>
      <label for="company">{{ _('Empresa:') }}</label>
      <input type="text" id="company" name="company" value="{{ user.company | default('', true) }}">
    </div>

    <!-- ===== Profesiones (múltiples con chips + sugerencias) ===== -->
    <div>
      <label for="professions-input">{{ _('Profesiones (opcional):') }}</label>

      <!-- Contenedor de chips + input -->
      <div id="professions-tags" class="tags-input">
        <input id="professions-input" type="text" placeholder="{{ _('Escribe y pulsa Enter…') }}">
      </div>

      <!-- Campo real (coma-separado) que se envía al backend -->
      <input type="hidden" name="professions" id="professions-hidden" value="{{ professions_prefill | default('', true) }}">

      <!-- (Opcional) datalist como fallback visual si quieres precargar opciones locales -->
      <datalist id="professions-list">
        {% if profession_options %}
          {% for p in profession_options %}
            <option value="{{ p }}"></option>
          {% endfor %}
        {% endif %}
      </datalist>
    </div>

    <div>
      <label for="description">{{ _('Descripción:') }}</label>
      <textarea id="description" name="description" maxlength="500" rows="4" style="resize: none; width: 100%;">{{ user.description | default('', true) }}</textarea>
    </div>

    <div>
      <label for="location">{{ _('Ubicación:') }}</label>
      <input type="text" id="location" name="location" value="{{ user.location | default('', true) }}">
    </div>

    <div>
      <label for="username">{{ _('Nombre de usuario:') }}</label>
      <input type="text" id="username" name="username" value="{{ user.username | default('', true) }}" disabled>
    </div>

    <div>
      <label for="phone">{{ _('Teléfono:') }}</label>
      <input type="text" id="phone" name="phone" value="{{ user.phone | default('', true) }}">
    </div>

    <div>
      <label for="email">{{ _('Correo electrónico:') }}</label>
      <input type="email" id="email" name="email" value="{{ user.email | default('', true) }}">
    </div>

    <button type="submit" class="save-profile-btn">{{ _('Guardar cambios') }}</button>
    <a href="{{ url_for('profile', username=user.username) }}" class="cancel-btn">{{ _('Cancelar') }}</a>
  </form>
</div>

<!-- Previsualización de la imagen -->
<script>
  document.getElementById('profile_pic').addEventListener('change', function (e) {
    const file = e.target.files[0];
    const preview = document.getElementById('profile-preview');
    if (file) {
      const reader = new FileReader();
      reader.onload = function (event) { preview.src = event.target.result; };
      reader.readAsDataURL(file);
    }
  });
</script>

<!-- ===== Estilos mínimos para chips + sugerencias ===== -->
<style>
  .tags-input { display:flex; flex-wrap:wrap; gap:.5rem; padding:.5rem; border:1px solid #ccc; border-radius:8px; background:#fff; }
  .tags-input:focus-within { outline: 2px solid #e5e7eb; border-color:#999; }
  .tags-input .tag { display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .6rem; border:1px solid #e5e7eb; border-radius:999px; font-size:.9rem; background:#f9fafb; }
  .tags-input .tag button { border:none; background:transparent; cursor:pointer; font-size:1rem; line-height:1; }
  .suggest-list { position:absolute; z-index:10; background:#fff; border:1px solid #e5e7eb; border-radius:8px; margin-top:.25rem; max-height:220px; overflow:auto; width:min(420px, 100%); box-shadow:0 8px 20px rgba(0,0,0,.06); }
  .suggest-item { padding:.5rem .75rem; cursor:pointer; }
  .suggest-item:hover { background:#f3f4f6; }
</style>

<!-- ===== JS de chips + sugerencias (usa /api/professions) ===== -->
<script>
(function() {
  const wrapper = document.getElementById('professions-tags');
  const input = document.getElementById('professions-input');
  const hidden = document.getElementById('professions-hidden');

  // Estado inicial: prellenado que viene del servidor (coma-separado)
  let tags = (hidden.value ? hidden.value.split(',') : []).map(t => t.trim()).filter(Boolean);

  const MAX_TAGS = 10;
  const MAX_LEN = 100;

  function render() {
    wrapper.querySelectorAll('.tag').forEach(e => e.remove());
    tags.forEach(name => {
      const chip = document.createElement('span');
      chip.className = 'tag';
      chip.textContent = name;
      const x = document.createElement('button');
      x.type = 'button';
      x.title = '{{ _("Quitar") }}';
      x.textContent = '×';
      x.onclick = () => {
        tags = tags.filter(t => t.toLowerCase() !== name.toLowerCase());
        sync();
      };
      chip.appendChild(x);
      wrapper.insertBefore(chip, input);
    });
    hidden.value = tags.join(', ');
  }
  function sync(){ render(); }

  function addFromText() {
    let v = input.value.trim();
    if (!v) return;
    const parts = v.split(',').map(s => s.trim()).filter(Boolean);
    for (const p of parts) {
      if (p.length > MAX_LEN) continue;
      if (tags.length >= MAX_TAGS) break;
      if (!tags.some(t => t.toLowerCase() === p.toLowerCase())) tags.push(p);
    }
    input.value = '';
    closeSuggest();
    sync();
  }

  // Sugerencias
  let suggestWrap, list, timer = null, booted = false;
  function ensureSuggest() {
    if (suggestWrap) return;
    suggestWrap = document.createElement('div');
    suggestWrap.style.position = 'relative';
    list = document.createElement('div');
    list.className = 'suggest-list';
    suggestWrap.appendChild(list);
    wrapper.appendChild(suggestWrap);
  }
  function showSuggest(items) {
    ensureSuggest();
    list.innerHTML = '';
    items.forEach(name => {
      const it = document.createElement('div');
      it.className = 'suggest-item';
      it.textContent = name;
      it.onclick = () => {
        if (tags.length < MAX_TAGS && !tags.some(t => t.toLowerCase() === name.toLowerCase())) {
          tags.push(name);
          sync();
        }
        input.value = '';
        closeSuggest();
        input.focus();
      };
      list.appendChild(it);
    });
    list.style.display = items.length ? 'block' : 'none';
  }
  function closeSuggest(){ if (list) list.style.display = 'none'; }

  async function bootstrapSuggestions() {
    if (booted) return; booted = true;
    const local = Array.from(document.querySelectorAll('#professions-list option')).map(o => o.value).filter(Boolean);
    if (local.length) showSuggest(local.slice(0, 10));
    try {
      const r = await fetch('/api/professions'); // top 10
      if (r.ok) {
        const data = await r.json();
        const uniq = [...new Set([...data, ...local])];
        showSuggest(uniq.slice(0, 10));
      }
    } catch {}
  }
  bootstrapSuggestions();

  input.addEventListener('input', () => {
    const q = input.value.trim();
    if (!q) { bootstrapSuggestions(); return; }
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try {
        const r = await fetch(`/api/professions?q=${encodeURIComponent(q)}`);
        if (!r.ok) { closeSuggest(); return; }
        const data = await r.json();
        const remaining = data.filter(n => !tags.some(t => t.toLowerCase() === n.toLowerCase()));
        showSuggest(remaining);
      } catch {}
    }, 140);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      addFromText();
    } else if (e.key === 'Backspace' && !input.value && tags.length) {
      tags.pop(); sync();
    }
  });

  render();
})();
</script>

{% endblock %}
